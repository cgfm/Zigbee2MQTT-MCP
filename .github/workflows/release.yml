name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.18.0
          cache: npm
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-version.mjs "$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: git diff --check

  build:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            hass_arch: amd64
          - platform: linux/arm64
            suffix: arm64
            hass_arch: aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/cgfm/zigbee2mqtt-mcp:${{ needs.validate.outputs.version }}-${{ matrix.suffix }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.version }}
            BUILD_ARCH=${{ matrix.hass_arch }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}

  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}" \
            "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}-amd64" \
            "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}-arm64"
          docker buildx imagetools inspect "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}"
      - if: ${{ !contains(needs.validate.outputs.version, '-') }}
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/cgfm/zigbee2mqtt-mcp:latest" \
            "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}-amd64" \
            "ghcr.io/cgfm/zigbee2mqtt-mcp:${VERSION}-arm64"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "Zigbee2MQTT-MCP ${GITHUB_REF_NAME}"
